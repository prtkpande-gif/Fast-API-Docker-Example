name: push_docker_image
on:
  push:
    branches:
      -main
  pull_request:
    branches:
      -main
  

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      #1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4  # predefined actions from github actions, @v4 is the latest version of the action.
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests with pytest
        run: |
          pytest
        



push-to-repo:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME}}
          password: ${{secrets.DOCKER_HUB_TOKEN}}
      
      - name: Extract version from tag or use commit hash
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{secrets.DOCKER_HUB_USERNAME}}/fastapi-docker-example:${{env.version}}