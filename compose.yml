version: "3"

services:
  # Web app in Python
  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload  # --reload = live reloading
    ports:
      - 8000:8000
    volumes:
      - .:/app
      - application-logs:/app/logs/
    networks:
      - my-network
    environment:
      - REDIS_HOST=redis-db
    depends_on:
      - redis-db # waits for redis-db to be up and running

  redis-db:
    image: "redis:7-alpine"
    volumes:
      - redis-data:/data
    networks:
      - my-network
    
  
networks:
  my-network:
    driver: bridge
  
volumes:
  application-logs:
  redis-data:
  






