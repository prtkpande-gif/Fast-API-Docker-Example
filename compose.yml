services:
  # Web App in Python
  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload  # --reload = live reloading
    ports:
      - "8081:8000"            # localhost:8081 -> container port 8000 (where uvicorn listens)
    volumes:
      - .:/app                 # Code changes on your PC are seen instantly in the container
      - application-logs:/app/logs   # Persistent volume for app.log (defined below)
    networks:
      - my-network             # Bridge network (defined below)
    environment:
      - REDIS_HOST=redis-db    # Injected into the app via os.getenv
      - LOG_DIR=/app/logs      # Where main.py writes app.log
    depends_on:
      - redis-db               # Starts redis-db before web

  # The database
  redis-db:
    image: "redis:7-alpine"
    volumes:
      - redis-data:/data       # Keeps the hit counter after restarts
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  application-logs:
  redis-data:



